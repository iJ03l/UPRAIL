[package]
name = "uprail-circle-escrow"
version = "0.1.0"
edition = "2021"
description = "Locked non-custodial escrow smart contract for Uprail Circles, timelocked Earn Vault Gifts, and unclaimed @handle sends (circle.uprail.near)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
bs58 = "0.5"
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
p256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = true
panic = "abort"
overflow-checks = true
